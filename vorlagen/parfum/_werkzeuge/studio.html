<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Studio: Produktbilder rendern</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>body { background: #333; } canvas { width: 600px; height: 600px; display: block; }</style>
</head>
<body>
<!-- Werkzeug: rendert einen Flakon der Kollektion freigestellt (render.cjs ruft diese Seite auf). -->
<script type="module">
  import { renderStudio } from './studio.js';
  const q = new URLSearchParams(location.search);
  renderStudio(q.get('v') || 'or', +(q.get('size') || 2400)).then((r) => { window.__done = r; }, (e) => { window.__done = { error: String(e) }; });
</script>
</body>
</html>
