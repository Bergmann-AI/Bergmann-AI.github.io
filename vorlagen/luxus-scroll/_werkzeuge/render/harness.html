<!doctype html><meta charset=utf-8><canvas id=c></canvas>
<script>
// Generic tiled renderer: window.renderImage(fragSrc, W, H, uniforms, tile) -> PNG dataURL
let noiseTex = null, gl = null;
async function init(){
  const cv = document.getElementById('c');
  gl = cv.getContext('webgl2', {preserveDrawingBuffer:true, antialias:false});
  const buf = new Uint8Array(await (await fetch('noise128.bin')).arrayBuffer());
  noiseTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_3D, noiseTex);
  gl.texImage3D(gl.TEXTURE_3D, 0, gl.RGBA8, 128,128,128, 0, gl.RGBA, gl.UNSIGNED_BYTE, buf);
  gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  for (const w of [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T, gl.TEXTURE_WRAP_R]) gl.texParameteri(gl.TEXTURE_3D, w, gl.REPEAT);
  return 'ready';
}
function compile(src, type){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
let skyTex = null, skyUrlLoaded = null;
async function loadSky(url){
  if(!url || skyUrlLoaded === url) return;
  const img = new Image(); img.src = url; await img.decode();
  skyTex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, skyTex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  skyUrlLoaded = url;
}
window.renderImage = async function(fragSrc, W, H, uniforms, tile, skyUrl){
  if(!gl) await init();
  await loadSky(skyUrl);
  const vs = `#version 300 es\nin vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(vs, gl.VERTEX_SHADER)); gl.attachShader(prog, compile(fragSrc, gl.FRAGMENT_SHADER));
  gl.linkProgram(prog); if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_3D, noiseTex);
  gl.uniform1i(gl.getUniformLocation(prog, 'uNoise'), 0);
  if (skyTex) { gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, skyTex); gl.uniform1i(gl.getUniformLocation(prog, 'uSky'), 1); gl.activeTexture(gl.TEXTURE0); }
  gl.uniform2f(gl.getUniformLocation(prog, 'uRes'), W, H);
  for (const [k, v] of Object.entries(uniforms || {})) {
    const l = gl.getUniformLocation(prog, k); if (!l) continue;
    if (typeof v === 'number') gl.uniform1f(l, v); else if (v.length === 2) gl.uniform2fv(l, v); else if (v.length === 3) gl.uniform3fv(l, v); else gl.uniform4fv(l, v);
  }
  const cv = gl.canvas; const T = tile || 256;
  cv.width = T; cv.height = T; gl.viewport(0,0,T,T);
  const out = document.createElement('canvas'); out.width = W; out.height = H; const ctx = out.getContext('2d');
  const px = new Uint8Array(T*T*4); const uOff = gl.getUniformLocation(prog, 'uOffset');
  for (let y0 = 0; y0 < H; y0 += T) for (let x0 = 0; x0 < W; x0 += T) {
    gl.uniform2f(uOff, x0, y0); gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.readPixels(0,0,T,T, gl.RGBA, gl.UNSIGNED_BYTE, px);
    // flip rows: GL origin bottom-left; we render with gl_FragCoord + offset where y counts from bottom of full image
    const img = ctx.createImageData(T, T);
    for (let r = 0; r < T; r++) img.data.set(px.subarray((T-1-r)*T*4, (T-r)*T*4), r*T*4);
    ctx.putImageData(img, x0, H - y0 - T);
    await new Promise(r => setTimeout(r, 0));
  }
  return out.toDataURL('image/png');
};
</script>
